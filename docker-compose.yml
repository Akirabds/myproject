services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: seguradora
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/seguradora
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: changeme
    ports:
      - '3000:3000'
  # Removed bind-mount to preserve production build artifacts created at image build time

volumes:
  pgdata:
